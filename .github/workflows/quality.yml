name: WhaleX quality checks
on:
  push:
    branches: [main, 'whalex/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check && npm test && node --check web/scene.js
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install playwright==1.57.0
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_smoke.py
      - run: python tests/scene_browser.py
      - run: python tests/scene_lock_browser.py
      - run: python tests/workspace_browser.py
      - run: python tests/visual_browser.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhaleX-browser-previews
          path: tests/*-preview.png
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WhaleX-motion-review
          path: |
            tests/motion-review/
            web/
            docs/MOTION_DESIGN.md
          if-no-files-found: ignore
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: whalex-ci-test-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: whalex-ci-test-only
      PGDATABASE: postgres
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/postgres_bootstrap.sql
      - run: psql -v ON_ERROR_STOP=1 -f supabase/schema.sql
      - run: psql -v ON_ERROR_STOP=1 -f tests/rls.sql
