name: Build WhaleX Windows
on:
  workflow_dispatch:
  push:
    branches: [main, 'whalex/**']
    paths: ['web/**', 'WhaleX_Tauri_Desktop/**', '.github/workflows/build-windows.yml']
  pull_request:
    paths: ['web/**', 'WhaleX_Tauri_Desktop/**']
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: WhaleX_Tauri_Desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - name: Check shared frontend
        working-directory: .
        run: npm run check
      - name: Install desktop build tool
        run: npm install
      - name: Build shared frontend desktop
        run: npm run tauri build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: WhaleX-Windows-Installer
          path: |
            WhaleX_Tauri_Desktop/src-tauri/target/release/bundle/msi/*.msi
            WhaleX_Tauri_Desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
