<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WhaleX Capture</title><link rel="stylesheet" href="capture.css"></head><body><div class="capture-shell"><div class="drag" data-tauri-drag-region><div><b>✦ WhaleX Quick Capture</b><span>想到就记，不打断当前工作</span></div><button id="closeBtn">×</button></div><input id="title" class="title" placeholder="标题（可选）"><textarea id="content" placeholder="记录 Prompt、Idea、Workflow 或任何值得保留的内容…"></textarea><div class="meta"><select id="library"></select><select id="type"><option>Prompt</option><option selected>Idea</option><option>Workflow</option><option>Snippet</option><option>Reference</option></select><input id="tags" placeholder="#标签"><label><input id="sticky" type="checkbox"> 置顶便签</label></div><div class="bottom"><span>Ctrl + Shift + Space 随时呼出</span><button id="saveBtn">保存到 WhaleX →</button></div></div><div class="toast" id="toast"></div><script src="db.js"></script><script src="capture.js"></script></body></html>
